# =============================================================================
# nginx.conf
# Qué hace:     configura el servidor web de la interfaz:
#                 - sirve los archivos compilados (la aplicación);
#                 - reenvía todo lo que empieza con /api al servidor (API);
#                 - cualquier otra dirección devuelve index.html, para que las
#                   pantallas (rutas del navegador) funcionen al recargar.
#
# Como el navegador solo habla con este servidor, la interfaz y la API quedan en
# el mismo origen y no hace falta configurar CORS.
# =============================================================================
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Resolución de nombres de Docker, para encontrar al contenedor "backend"
  # aunque este tarde un poco más en iniciar.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $servidor_api http://backend:3000;
    proxy_pass $servidor_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con huella en el nombre (assets/) no cambian: se pueden guardar.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La página principal nunca se guarda: así una versión nueva se ve al recargar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
